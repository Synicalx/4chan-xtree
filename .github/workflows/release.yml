name: Release 4chan xtree

on:
  push:
    tags:
      - 'v*'
      - 'xtree-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.25.0). Defaults to version in version.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine version and tag
        id: meta
        run: |
          VERSION=$(jq -r '.version' version.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build userscript and extension bundles
        run: npm run build:all

      - name: Package browser extension archives (MV2 and MV3)
        run: |
          mkdir -p dist-crx/mv2 dist-crx/mv3
          cp -r builds/crx/* dist-crx/mv2/
          rm -f dist-crx/mv2/manifestV3.json
          (cd dist-crx/mv2 && zip -r ../../builds/4chan-xtree-crx.zip .)

          cp -r builds/crx/* dist-crx/mv3/
          mv dist-crx/mv3/manifestV3.json dist-crx/mv3/manifest.json
          (cd dist-crx/mv3 && zip -r ../../builds/4chan-xtree-crx-mv3.zip .)
          rm -rf dist-crx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 4chan xtree ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            builds/4chan-xtree.user.js
            builds/4chan-xtree.meta.js
            builds/4chan-xtree.min.user.js
            builds/4chan-xtree.min.meta.js
            builds/4chan-xtree-crx.zip
            builds/4chan-xtree-crx-mv3.zip
